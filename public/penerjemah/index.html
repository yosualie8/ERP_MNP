<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Penerjemah Indonesia ⇄ Mandarin</title>
<!--
  Penerjemah percakapan Indonesia ⇄ Mandarin (owner 15 Nov 2026, sementara di web MNP).
  Ponsel diletakkan di meja di antara dua orang: separuh atas diputar 180° untuk lawan bicara (Mandarin),
  separuh bawah untuk pengguna (Indonesia). Tiap sisi punya mic sendiri: tekan = mulai bicara, tekan lagi = selesai;
  menekan mic satu sisi mematikan mic sisi lain. Terjemahan tampil langsung selagi bicara.
  Pengenalan suara & suara baca = Web Speech API peramban (gratis); terjemahan + pinyin = Google Translate (client gtx).
-->
<style>
  :root { --garis: #111; --teks: #111; --redup: #6b7280; --kotak: #fafafa; --aksen: #dc2626; --biru: #2563eb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--teks);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

  .sisi { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .sisi.atas { transform: rotate(180deg); }

  .kepala { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .label { font-size: 22px; font-weight: 600; }
  .status { font-size: 14px; color: var(--redup); min-height: 1.2em; text-align: right; }
  .status.dengar { color: var(--aksen); font-weight: 600; }

  .kotak { flex: 1 1 auto; min-height: 0; border: 2px solid var(--garis); border-radius: 14px; background: var(--kotak);
    padding: 12px 14px; display: flex; flex-direction: column; overflow-y: auto; cursor: text; transition: border-color .2s, box-shadow .2s; }
  .kotak.giliran { border-color: var(--aksen); box-shadow: 0 0 0 4px rgba(220,38,38,.15); }
  .kotak textarea { flex: 0 0 auto; min-height: 1.4em; overflow: hidden; width: 100%; border: 0; outline: 0; resize: none; background: transparent;
    color: inherit; font: inherit; font-size: 26px; line-height: 1.35; padding: 0; }
  .kotak textarea::placeholder { color: #b6bcc6; }
  .zh textarea { font-size: 34px; }
  .pinyin { font-size: 19px; color: var(--biru); line-height: 1.35; margin-top: 6px; }
  .pinyin:empty, .baku:empty { display: none; }
  .baku { font-size: 15px; color: var(--redup); margin-top: 6px; font-style: italic; }
  .sementara textarea { color: var(--redup); }

  .bawah { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .tombol { border: 2px solid var(--garis); background: #fff; color: var(--teks); border-radius: 14px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .tombol:active { transform: scale(.96); }
  .tombol svg { width: 26px; height: 26px; }
  .baca { width: 52px; height: 52px; }
  .mic { width: 76px; height: 76px; flex-direction: column; gap: 2px; font-size: 12px; font-weight: 600; }
  .mic svg { width: 30px; height: 30px; }
  .mic.aktif { background: var(--aksen); border-color: var(--aksen); color: #fff; animation: denyut 1.2s ease-in-out infinite; }
  @keyframes denyut { 0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,.45); } 50% { box-shadow: 0 0 0 12px rgba(220,38,38,0); } }

  .pemisah { flex: 0 0 auto; position: relative; height: 6px; background: var(--garis); }
  .kendali { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 8px; }
  .pil { border: 2px solid var(--garis); background: #fff; color: var(--teks); border-radius: 999px; padding: 5px 12px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .pil[aria-pressed="true"] { background: var(--garis); color: #fff; }

  .pesan { position: fixed; left: 50%; bottom: 50%; transform: translate(-50%, 60px); background: #111; color: #fff;
    padding: 8px 14px; border-radius: 10px; font-size: 14px; max-width: 90vw; text-align: center; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 5; }
  .pesan.tampil { opacity: .92; }

  @media (min-height: 760px) { .kotak textarea { font-size: 30px; } .zh textarea { font-size: 40px; } .pinyin { font-size: 21px; } }
</style>
</head>
<body>

<!-- Separuh atas: lawan bicara berbahasa Mandarin (diputar 180°) -->
<section class="sisi atas" data-bahasa="zh">
  <div class="kepala">
    <span class="label">中文 · Mandarin</span>
    <span class="status" id="status-zh"></span>
  </div>
  <div class="kotak zh" id="kotak-zh">
    <textarea id="teks-zh" placeholder="按麦克风说话，说完再按一次…" aria-label="Teks Mandarin"></textarea>
    <div class="pinyin" id="pinyin-zh"></div>
  </div>
  <div class="bawah">
    <button class="tombol baca" id="baca-zh" type="button" aria-label="Bacakan teks Mandarin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="tombol mic" id="mic-zh" type="button" aria-label="Mic Mandarin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>
      <span>说话</span>
    </button>
  </div>
</section>

<div class="pemisah">
  <div class="kendali">
    <button class="pil" id="tgl-suara" type="button" aria-pressed="true" title="Bacakan hasil terjemahan sesudah mic dimatikan">🔊 Suara</button>
  </div>
</div>

<!-- Separuh bawah: pengguna berbahasa Indonesia -->
<section class="sisi" data-bahasa="id">
  <div class="kepala">
    <span class="label">Bahasa Indonesia</span>
    <span class="status" id="status-id"></span>
  </div>
  <div class="kotak" id="kotak-id">
    <textarea id="teks-id" placeholder="Tekan mic, bicara, lalu tekan lagi bila selesai…" aria-label="Teks Indonesia"></textarea>
    <div class="baku" id="baku-id"></div>
  </div>
  <div class="bawah">
    <button class="tombol baca" id="baca-id" type="button" aria-label="Bacakan teks Indonesia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="tombol mic" id="mic-id" type="button" aria-label="Mic Indonesia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>
      <span>mic</span>
    </button>
  </div>
</section>

<div class="pesan" id="pesan" role="status"></div>

<script src="bakukan.js?v=1"></script>
<script>
(() => {
  'use strict';

  const BAHASA = {
    id: { kodeTerjemah: 'id',    kodeSuara: 'id-ID', lawan: 'zh', pemisah: ' ',
          teks: { dengar: 'Mendengarkan…', baca: 'Membacakan…', mic: 'mic', stop: 'stop' } },
    zh: { kodeTerjemah: 'zh-CN', kodeSuara: 'zh-CN', lawan: 'id', pemisah: '',
          teks: { dengar: '正在听…', baca: '朗读中…', mic: '说话', stop: '停止' } },
  };
  const BATAS_HENING_MS = 180000;   // mic yang lupa dimatikan berhenti sendiri sesudah 3 menit tanpa suara
  const kodeDengar = { id: 'id-ID', zh: 'zh-CN' };   // kode pengenalan suara (zh bisa diganti cmn-Hans-CN)

  // Catatan kejadian ke log akses server (berkas kosong catat.txt + query) untuk menelusuri masalah di ponsel.
  const idSesi = Math.random().toString(36).slice(2, 8);
  function catat(kejadian, data = {}) {
    try {
      const q = new URLSearchParams({ s: idSesi, k: kejadian, ...data });
      fetch('catat.txt?' + q, { cache: 'no-store', keepalive: true }).catch(() => {});
    } catch (e) {}
  }

  const el = id => document.getElementById(id);
  // Tinggi kotak teks mengikuti isi supaya pinyin tepat di bawah aksara.
  const rapikan = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  const isi = (ta, teks) => { ta.value = teks; rapikan(ta); };
  const ui = {};
  for (const b of ['id', 'zh']) {
    ui[b] = { teks: el('teks-' + b), status: el('status-' + b), baca: el('baca-' + b), kotak: el('kotak-' + b), mic: el('mic-' + b) };
  }
  const pinyin = el('pinyin-zh');
  const bakuId = el('baku-id');
  // Ucapan Indonesia sehari-hari (gaul / campur Sunda-Jawa) dibakukan dulu — lihat bakukan.js.
  const bakukan = window.bakukan || (t => t);

  const tglSuara = el('tgl-suara');
  const suaraNyala = () => tglSuara.getAttribute('aria-pressed') === 'true';
  if (localStorage.getItem('penerjemah.suara') === '0') tglSuara.setAttribute('aria-pressed', 'false');
  tglSuara.addEventListener('click', () => {
    const nyala = !suaraNyala();
    tglSuara.setAttribute('aria-pressed', String(nyala));
    localStorage.setItem('penerjemah.suara', nyala ? '1' : '0');
    if (!nyala) window.speechSynthesis?.cancel();
  });

  let timerPesan;
  function pesan(teks) {
    const p = el('pesan');
    p.textContent = teks;
    p.classList.add('tampil');
    clearTimeout(timerPesan);
    timerPesan = setTimeout(() => p.classList.remove('tampil'), 3500);
  }

  function setStatus(b, kunci) {
    ui[b].status.textContent = kunci ? BAHASA[b].teks[kunci] : '';
    ui[b].status.classList.toggle('dengar', kunci === 'dengar');
  }

  // ---------- Terjemahan (Google Translate, client gtx — CORS terbuka, tanpa kunci) ----------
  async function terjemah(teks, dari) {
    const ke = BAHASA[dari].lawan;
    const baku = dari === 'id' ? bakukan(teks) : teks;
    teks = baku || teks;
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&dt=rm'
      + '&sl=' + BAHASA[dari].kodeTerjemah + '&tl=' + BAHASA[ke].kodeTerjemah + '&q=' + encodeURIComponent(teks);
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    let hasil = '', latinHasil = '', latinAsal = '';
    for (const s of data[0] || []) {
      if (typeof s[0] === 'string') hasil += s[0];
      else { latinHasil = s[2] || latinHasil; latinAsal = s[3] || latinAsal; }
    }
    return { hasil, latinHasil, latinAsal, baku };
  }

  // Tulis hasil terjemahan di sisi lawan; `sementara` = masih berubah selagi pembicara bicara (abu-abu).
  function tampilkan(dari, t, sementara) {
    const ke = BAHASA[dari].lawan;
    isi(ui[ke].teks, t.hasil);
    pinyin.textContent = dari === 'zh' ? t.latinAsal : t.latinHasil;
    const asli = ui.id.teks.value.trim().toLowerCase().replace(/[.,!?\s]+/g, ' ').trim();
    const baku = (t.baku || '').toLowerCase().replace(/[.,!?\s]+/g, ' ').trim();
    bakuId.textContent = dari === 'id' && baku && baku !== asli ? 'Dibaca: ' + t.baku : '';
    ui[ke].kotak.classList.toggle('sementara', sementara);
  }

  // Terjemahan langsung: paling banyak satu permintaan berjalan; teks terbaru menunggu kiriman berikutnya.
  let liveSibuk = false, liveAntre = null;
  function terjemahLangsung(dari, teks, g) {
    if (liveSibuk) { liveAntre = { dari, teks, g }; return; }
    liveSibuk = true;
    terjemah(teks, dari)
      .then(t => { if (aktif === dari && g === generasi) tampilkan(dari, t, true); })
      .catch(() => {})
      .finally(() => {
        liveSibuk = false;
        const a = liveAntre; liveAntre = null;
        if (a && a.g === generasi) terjemahLangsung(a.dari, a.teks, a.g);
      });
  }

  // ---------- Suara baca (speechSynthesis) ----------
  let daftarSuara = [];
  const muatSuara = () => { daftarSuara = window.speechSynthesis ? speechSynthesis.getVoices() : []; };
  if (window.speechSynthesis) { muatSuara(); speechSynthesis.addEventListener?.('voiceschanged', muatSuara); }

  function pilihSuara(kode) {
    const awalan = kode.slice(0, 2).toLowerCase();
    const cocok = daftarSuara.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(awalan));
    return cocok.find(v => v.lang.replace('_', '-').toLowerCase() === kode.toLowerCase()) || cocok[0] || null;
  }

  function bacakanTeks(teks, b) {
    return new Promise(selesai => {
      if (!window.speechSynthesis || !teks) return selesai();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(teks);
      u.lang = BAHASA[b].kodeSuara;
      const v = pilihSuara(u.lang);
      if (v) u.voice = v;
      u.rate = b === 'zh' ? 0.9 : 1;
      let tuntas = false;
      const akhiri = () => { if (!tuntas) { tuntas = true; selesai(); } };
      u.onend = akhiri;
      u.onerror = akhiri;
      // Pengaman bila peramban tidak pernah memicu onend.
      setTimeout(akhiri, 2500 + teks.length * 220);
      speechSynthesis.speak(u);
    });
  }

  for (const b of ['id', 'zh']) {
    ui[b].baca.addEventListener('click', async () => {
      if (aktif) return;
      setStatus(b, 'baca');
      await bacakanTeks(ui[b].teks.value.trim(), b);
      setStatus(b, null);
    });
  }

  // ---------- Mic per sisi: tekan = mulai, tekan lagi = selesai ----------
  // Pengenal suara peramban berhenti sendiri tiap jeda bicara; selama mic masih menyala ia dinyalakan ulang
  // dan teksnya disambung, jadi satu kali tekan bisa memuat beberapa kalimat.
  const Pengenal = window.SpeechRecognition || window.webkitSpeechRecognition;
  let aktif = null;          // sisi yang mic-nya menyala: 'id' | 'zh' | null
  let generasi = 0;          // naik tiap mic mulai/selesai → hasil terjemahan lama diabaikan
  let pengenal = null;       // pengenal ronde yang sedang berjalan
  let terkumpul = '';        // teks dari ronde-ronde sebelumnya selama mic menyala
  let menutup = false;       // tombol stop sudah ditekan, menunggu hasil terakhir
  let adaUcapan = false;     // sudah ada suara tertangkap sejak mic ditekan
  let awalHening = 0, gagalCepat = 0, timerTutup = null;

  const gabung = (b, a, c) => [a, c].filter(Boolean).join(BAHASA[b].pemisah).trim();

  function tampilkanMic() {
    for (const b of ['id', 'zh']) {
      const nyala = aktif === b;
      ui[b].mic.classList.toggle('aktif', nyala);
      ui[b].mic.querySelector('span').textContent = nyala ? BAHASA[b].teks.stop : BAHASA[b].teks.mic;
      ui[b].kotak.classList.toggle('giliran', nyala);
    }
  }

  function ronde(b) {
    const g = generasi;
    const p = new Pengenal();
    p.lang = kodeDengar[b];
    p.interimResults = true;
    p.continuous = false;
    p.maxAlternatives = 1;
    let final = '', sementara = '', galat = '';
    const mulaiPada = Date.now();
    catat('mulai', { b, lang: p.lang });

    p.onresult = ev => {
      if (pengenal !== p) return;
      final = ''; sementara = '';
      for (let i = 0; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) final += r[0].transcript; else sementara += r[0].transcript;
      }
      const teks = gabung(b, terkumpul, (final + sementara).trim());
      if (!teks) return;
      if (!adaUcapan) { adaUcapan = true; if (b === 'zh') pinyin.textContent = ''; bakuId.textContent = ''; }
      awalHening = Date.now();
      isi(ui[b].teks, teks);
      ui[b].kotak.classList.toggle('sementara', !!sementara);
      terjemahLangsung(b, teks, g);
    };
    p.onerror = ev => {
      if (pengenal !== p) return;
      galat = ev.error || '?';
      catat('galat', { b, lang: p.lang, e: galat, ms: Date.now() - mulaiPada });
      if (galat === 'not-allowed' || galat === 'service-not-allowed') {
        pengenal = null; batalkan(); pesan('Izin mikrofon ditolak. Izinkan mic untuk situs ini di pengaturan peramban.');
      } else if (galat === 'language-not-supported' && b === 'zh' && p.lang !== 'cmn-Hans-CN') {
        // Sebagian perangkat Android hanya mengenal kode Mandarin "cmn-Hans-CN".
        kodeDengar.zh = 'cmn-Hans-CN';
        pengenal = null;
        setTimeout(() => { if (aktif === 'zh' && !pengenal) ronde('zh'); }, 200);
      } else if (galat === 'language-not-supported') {
        pengenal = null; batalkan(); pesan('Bahasa ini belum didukung pengenalan suara di perangkat ini.');
      }
    };
    p.onend = () => {
      if (pengenal !== p) return;          // mic sudah dimatikan / diganti sisi lain
      pengenal = null;
      const ucapan = (final || sementara).trim();
      terkumpul = gabung(b, terkumpul, ucapan);
      catat('akhir', { b, hasil: ucapan.length, ms: Date.now() - mulaiPada });
      if (aktif !== b || g !== generasi) return;
      if (menutup) { selesai(b); return; }
      // Mic masih menyala: nyalakan ulang ronde berikutnya.
      gagalCepat = !ucapan && Date.now() - mulaiPada < 700 ? gagalCepat + 1 : 0;
      if (gagalCepat >= 6) { batalkan(); pesan('Mic tidak bisa mendengar' + (galat ? ' (' + galat + ')' : '') + '. Coba tekan mic lagi.'); return; }
      if (Date.now() - awalHening > BATAS_HENING_MS) { selesai(b); pesan('Mic dimatikan — 3 menit tanpa suara.'); return; }
      setTimeout(() => { if (aktif === b && g === generasi && !pengenal && !menutup) ronde(b); }, gagalCepat ? 400 : 60);
    };

    pengenal = p;
    try { p.start(); }
    catch (e) { catat('galat-start', { b, e: String(e && e.message || e) }); pengenal = null; batalkan(); pesan('Mic tidak bisa dinyalakan.'); }
  }

  function mulai(b) {
    if (!Pengenal) {
      pesan('Peramban ini tidak mendukung pengenalan suara. Pakai Chrome (Android) atau Safari (iPhone), atau ketik di kotak.');
      return;
    }
    // iOS hanya mengizinkan suara baca yang dipicu sentuhan — "pancing" sekali di sini.
    if (window.speechSynthesis && !window.__suaraSiap) { speechSynthesis.speak(new SpeechSynthesisUtterance('')); window.__suaraSiap = true; }
    if (aktif) batalkan();                 // mic sisi lain dimatikan
    window.speechSynthesis?.cancel();
    for (const s of ['id', 'zh']) setStatus(s, null);
    // Kotak tidak dikosongkan di sini: terjemahan sebelumnya tetap terbaca sampai suara pertama tertangkap.
    aktif = b; generasi++; terkumpul = ''; menutup = false; adaUcapan = false; awalHening = Date.now(); gagalCepat = 0;
    ui[b].kotak.classList.remove('sementara');
    catat('tekan', { b });
    tampilkanMic();
    setStatus(b, 'dengar');
    ronde(b);
  }

  // Tombol stop: ambil hasil terakhir dari pengenal, lalu terjemahan akhir.
  function tutup(b) {
    if (aktif !== b || menutup) return;
    menutup = true;
    catat('stop', { b });
    if (!pengenal) { selesai(b); return; }
    try { pengenal.stop(); } catch (e) { selesai(b); return; }
    // Pengaman bila peramban tidak memicu onend.
    timerTutup = setTimeout(() => { if (aktif === b && menutup) { const p = pengenal; pengenal = null; try { p && p.abort(); } catch (e) {} selesai(b); } }, 1500);
  }

  // Mic mati dengan teks terakhir: terjemahkan utuh, tampilkan hitam, lalu bacakan untuk lawan bicara.
  async function selesai(b) {
    clearTimeout(timerTutup);
    const ke = BAHASA[b].lawan;
    const teks = adaUcapan ? ui[b].teks.value.trim() : '';
    aktif = null; menutup = false; generasi++;
    const g = generasi;
    ui[b].kotak.classList.remove('sementara');
    setStatus(b, null);
    tampilkanMic();
    if (!teks) return;
    try {
      const t = await terjemah(teks, b);
      if (g !== generasi) return;
      tampilkan(b, t, false);
      if (suaraNyala() && t.hasil) {
        setStatus(ke, 'baca');
        await bacakanTeks(t.hasil, ke);
        if (g === generasi) setStatus(ke, null);
      }
    } catch (e) {
      catat('terjemah-gagal', { b, e: String(e && e.message || e) });
      if (g === generasi) pesan('Terjemahan gagal — periksa koneksi internet.');
    }
  }

  // Matikan mic tanpa terjemahan akhir (dipakai saat pindah ke sisi lain / izin ditolak).
  function batalkan() {
    clearTimeout(timerTutup);
    const b = aktif;
    const p = pengenal; pengenal = null;
    if (p) try { p.abort(); } catch (e) {}
    aktif = null; menutup = false; generasi++;
    if (b) { setStatus(b, null); ui[b].kotak.classList.remove('sementara'); ui[BAHASA[b].lawan].kotak.classList.remove('sementara'); }
    tampilkanMic();
  }

  for (const b of ['id', 'zh']) {
    ui[b].mic.addEventListener('click', () => { if (aktif === b) tutup(b); else mulai(b); });
  }

  // ---------- Mengetik langsung di kotak (saat mic mati) ----------
  let nomorKetik = 0;
  for (const b of ['id', 'zh']) {
    let jeda;
    ui[b].teks.addEventListener('input', () => {
      rapikan(ui[b].teks);
      if (b === 'zh') pinyin.textContent = '';
      clearTimeout(jeda);
      jeda = setTimeout(async () => {
        const teks = ui[b].teks.value.trim(), nomor = ++nomorKetik;
        if (!teks) { isi(ui[BAHASA[b].lawan].teks, ''); pinyin.textContent = ''; bakuId.textContent = ''; return; }
        try { const t = await terjemah(teks, b); if (nomor === nomorKetik) tampilkan(b, t, false); }
        catch (e) { pesan('Terjemahan gagal — periksa koneksi internet.'); }
      }, 500);
    });
    ui[b].kotak.addEventListener('click', ev => { if (ev.target === ui[b].kotak) ui[b].teks.focus(); });
    ui[b].teks.addEventListener('focus', () => { if (aktif) tutup(aktif); });
  }

  // ---------- Layar tetap menyala selama dipakai ----------
  let kunciLayar = null;
  async function jagaLayar() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') kunciLayar = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') jagaLayar(); else if (aktif) batalkan(); });
  document.addEventListener('click', () => { if (!kunciLayar) jagaLayar(); }, { once: true });

  if (!Pengenal) setTimeout(() => pesan('Pengenalan suara tidak tersedia di peramban ini — ketik di kotak untuk menerjemahkan.'), 400);
})();
</script>
</body>
</html>
